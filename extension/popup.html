<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AegisShield AI Security Guard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 390px;
      background: #0c0f17;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #38bdf8, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .brand-title { font-weight: 800; font-size: 14px; }
    .brand-sub { font-size: 11px; color: #94a3b8; }
    .status-pill {
      font-size: 10px;
      font-family: monospace;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 700;
    }
    .card {
      background: #141926;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .target-url {
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .score-num {
      font-family: monospace;
      font-size: 24px;
      font-weight: 800;
    }
    .verdict-badge {
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
    }
    .findings-list {
      list-style: none;
      font-size: 11px;
      color: #cbd5e1;
      max-height: 115px;
      overflow-y: auto;
      margin-top: 8px;
    }
    .findings-list li {
      padding: 6px 8px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      margin-bottom: 5px;
      border-left: 3px solid #6366f1;
    }
    .input-group {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    input[type="text"] {
      flex: 1;
      background: #0c0f17;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 8px 10px;
      color: #fff;
      font-size: 12px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 12px;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.92; }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #0284c7);
      color: #fff;
    }
    .btn-danger {
      width: 100%;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      margin-bottom: 8px;
      padding: 9px;
    }
    .btn-console {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: rgba(255,255,255,0.07);
      color: #e2e8f0;
      padding: 9px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .note {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">🛡️</div>
      <div>
        <div class="brand-title">AegisShield Agent</div>
        <div class="brand-sub">Real-Time Browser & Web3 Guard</div>
      </div>
    </div>
    <span id="api-status" class="status-pill">AGENT ACTIVE</span>
  </div>

  <!-- Current Tab Live Verdict -->
  <div class="card">
    <div style="font-size:10px; text-transform:uppercase; color:#94a3b8; font-weight:700; margin-bottom:4px;">Active Tab Telemetry</div>
    <div id="tab-url" class="target-url">Scanning current tab...</div>
    <div class="score-row">
      <div>
        <div style="font-size:10px; color:#94a3b8;">Deterministic Score</div>
        <div id="tab-score" class="score-num">--/100</div>
      </div>
      <span id="tab-verdict" class="verdict-badge" style="background:rgba(255,255,255,0.1);">Analyzing...</span>
    </div>
    <div id="tab-reply" class="note">Valid TLS/HTTPS padlock ≠ Legitimate website.</div>
    <ul id="tab-findings" class="findings-list"></ul>
  </div>

  <!-- Ask Aegis Copilot / Quick Scan -->
  <div class="card">
    <div style="font-size:11px; font-weight:700; color:#e2e8f0;">Ask Aegis AI Agent / Check Any Link</div>
    <div class="input-group">
      <input id="quick-query" type="text" placeholder="Paste link, UPI ID, or ask 'I clicked...'"/>
      <button id="btn-ask" class="btn-primary">Scan</button>
    </div>
  </div>

  <!-- Demo Phishing Blocker Trigger -->
  <button id="btn-simulate-block" class="btn-danger">
    🚨 Simulate Full-Screen Phishing Block on This Tab
  </button>

  <a href="http://localhost:8000/agent" target="_blank" class="btn-console">
    Open Full Autonomous Agent & Watchdog Console →
  </a>

  <script src="popup.js"></script>
</body>
</html>
